          package com.nova.dm.engine

          import kotlinx.coroutines.*
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.util.concurrent.atomic.AtomicLong
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          class TurboDownloader(private val client: OkHttpClient) {

              private fun getText(url: String, h: Map<String, String>): String {
                  val r = Request.Builder().url(url).apply { h.forEach { (k, v) -> header(k, v) } }.build()
                  return client.newCall(r).execute().use { if (!it.isSuccessful) error("HTTP ${it.code}"); it.body!!.string() }
              }

              private fun getBytesRetry(url: String, h: Map<String, String>): ByteArray {
                  var last: Exception? = null
                  repeat(4) {
                      try {
                          val r = Request.Builder().url(url).apply { h.forEach { (k, v) -> header(k, v) } }.build()
                          return client.newCall(r).execute().use { if (!it.isSuccessful) error("HTTP ${it.code}"); it.body!!.bytes() }
                      } catch (e: Exception) { last = e }
                  }
                  throw last ?: error("Segment failed")
              }

              suspend fun downloadHlsTurbo(
                  url: String, h: Map<String, String>, threads: Int,
                  onChunk: suspend (ByteArray) -> Unit, onProg: (Int, Int) -> Unit
              ) = coroutineScope {
                  val lines = getText(url, h).lines().map { it.trim() }; val base = url.toHttpUrl()
                  var key: ByteArray? = null; var iv: ByteArray? = null
                  lines.firstOrNull { it.startsWith("#EXT-X-KEY:METHOD=AES-128") }?.let { kl ->
                      Regex("URI=\"([^\"]+)\"").find(kl)?.groupValues?.get(1)?.let { key = getBytesRetry(base.resolve(it).toString(), h) }
                      Regex("IV=0x([0-9a-fA-F]+)").find(kl)?.groupValues?.get(1)?.let { hx -> iv = hx.chunked(2).map { it.toInt(16).toByte() }.toByteArray() }
                  }
                  val segs = lines.filter { it.isNotEmpty() && !it.startsWith("#") }.map { base.resolve(it).toString() }
                  require(segs.isNotEmpty()) { "No HLS segments" }
                  lines.firstOrNull { it.startsWith("#EXT-X-MAP:") }?.let { ml ->
                      Regex("URI=\"([^\"]+)\"").find(ml)?.groupValues?.get(1)?.let { onChunk(getBytesRetry(base.resolve(it).toString(), h)) }
                  }
                  val batch = threads.coerceIn(4, 64)
                  var done = 0
                  var lastUi = 0L
                  for (s in segs.indices step batch) {
                      val slice = segs.subList(s, minOf(s + batch, segs.size))
                      val got = slice.mapIndexed { idx, su ->
                          async(Dispatchers.IO) {
                              var d = getBytesRetry(su, h)
                              if (key != null) {
                                  val seqIv = iv ?: ByteArray(16).apply {
                                      val q = s + idx; this[12]=(q shr 24).toByte(); this[13]=(q shr 16).toByte(); this[14]=(q shr 8).toByte(); this[15]=q.toByte()
                                  }
                                  val c = Cipher.getInstance("AES/CBC/PKCS5Padding")
                                  c.init(Cipher.DECRYPT_MODE, SecretKeySpec(key, "AES"), IvParameterSpec(seqIv))
                                  d = c.doFinal(d)
                              }
                              d
                          }
                      }.awaitAll()
                      for (b in got) {
                          onChunk(b); done++
                          val now = System.currentTimeMillis()
                          if (now - lastUi > 250 || done == segs.size) { lastUi = now; onProg(done, segs.size) }
                      }
                  }
              }

              suspend fun downloadDirectToFileTurbo(
                  url: String, h: Map<String, String>, outFile: File, threads: Int, onProg: (Long, Long) -> Unit
              ) = withContext(Dispatchers.IO) {
                  var total = -1L; var ranged = false
                  try {
                      val hr = Request.Builder().url(url).head().apply { h.forEach { (k, v) -> header(k, v) } }.build()
                      client.newCall(hr).execute().use { resp ->
                          total = resp.header("Content-Length")?.toLongOrNull() ?: -1L
                          ranged = resp.header("Accept-Ranges")?.contains("bytes", true) == true
                      }
                  } catch (_: Exception) {}

                  if (!ranged || total < 2 * 1024 * 1024) {
                      outFile.outputStream().buffered().use { os -> streamDirect(url, h, { os.write(it) }, onProg) }
                      return@withContext
                  }

                  val workers = threads.coerceIn(4, 64)
                  val chunk = total / workers
                  val doneBytes = AtomicLong(0L)
                  val lastUi = AtomicLong(0L)
                  RandomAccessFile(outFile, "rw").use { raf ->
                      raf.setLength(total)
                      val channel = raf.channel
                      coroutineScope {
                          (0 until workers).map { w ->
                              val start = w * chunk
                              val end = if (w == workers - 1) total - 1 else (start + chunk - 1)
                              async(Dispatchers.IO) {
                                  var pos = start; var attempt = 0
                                  while (pos <= end && attempt < 5) {
                                      try {
                                          val req = Request.Builder().url(url).header("Range", "bytes=$pos-$end")
                                              .apply { h.forEach { (k, v) -> header(k, v) } }.build()
                                          client.newCall(req).execute().use { resp ->
                                              if (!resp.isSuccessful) error("HTTP ${resp.code}")
                                              val ins = resp.body!!.byteStream()
                                              val buf = ByteArray(128 * 1024)
                                              while (true) {
                                                  val n = ins.read(buf); if (n <= 0) break
                                                  channel.write(ByteBuffer.wrap(buf, 0, n), pos)
                                                  pos += n
                                                  val cur = doneBytes.addAndGet(n.toLong())
                                                  val now = System.currentTimeMillis()
                                                  val prev = lastUi.get()
                                                  if ((now - prev > 250 || cur >= total) && lastUi.compareAndSet(prev, now)) {
                                                      onProg(cur, total)
                                                  }
                                              }
                                          }
                                      } catch (e: Exception) { attempt++; if (attempt >= 5) throw e }
                                  }
                              }
                          }.awaitAll()
                      }
                  }
              }

              suspend fun streamDirect(
                  url: String, h: Map<String, String>, onChunk: suspend (ByteArray) -> Unit, onProg: (Long, Long) -> Unit
              ) = withContext(Dispatchers.IO) {
                  val r = Request.Builder().url(url).apply { h.forEach { (k, v) -> header(k, v) } }.build()
                  client.newCall(r).execute().use { resp ->
                      if (!resp.isSuccessful) error("HTTP ${resp.code}")
                      val body = resp.body!!; val tot = body.contentLength(); val ins = body.byteStream()
                      val buf = ByteArray(256 * 1024); var read = 0L; var lastUi = 0L
                      while (true) {
                          val n = ins.read(buf); if (n <= 0) break
                          onChunk(buf.copyOf(n)); read += n
                          val now = System.currentTimeMillis()
                          if (now - lastUi > 250) { lastUi = now; onProg(read, tot) }
                      }
                      onProg(read, tot)
                  }
              }
          }
