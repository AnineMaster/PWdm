                  val opts = arrayOf("Best Quality (Auto)", "1080p MP4", "720p MP4", "480p MP4", "Audio Only (M4A)")
                  val fmts = arrayOf("bv*+ba/b", "bv*[height<=1080]+ba/b[height<=1080]", "bv*[height<=720]+ba/b[height<=720]", "bv*[height<=480]+ba/b[height<=480]", "ba/b")
