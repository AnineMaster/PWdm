name: Build PWdm v2 APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate PWdm v2 Project
        run: |
          mkdir -p app/src/main/res/layout app/src/main/java/com/nova/dm/{sniffer,engine,drive,storage,vpn}

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven("https://jitpack.io") }
          }
          rootProject.name = "PWdm"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.10" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.nova.dm"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nova.dm"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = false
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { viewBinding = true }
              lint { checkReleaseBuilds = false; abortOnError = false }
              packaging {
                  jniLibs { useLegacyPackaging = true }
                  resources.excludes += listOf("META-INF/INDEX.LIST", "META-INF/DEPENDENCIES")
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
              implementation("com.wireguard.android:tunnel:1.0.20230706")
              implementation("com.google.android.gms:play-services-auth:21.3.0")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepattributes *Annotation*
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keep class com.yausername.** { *; }
          -keep class com.wireguard.** { *; }
          -dontwarn com.yausername.**
          -dontwarn com.wireguard.**
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:label="PWdm"
