      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APKs
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Print Exact Failure
        if: failure()
        run: |
          ERR=$(grep -E "FAILURE:|What went wrong:|Execution failed|^e: " build.log | head -n 5 | tr '\n' ' ')
          echo "::error::$ERR"
          tail -n 60 build.log

      - name: Prepare APK Files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v6
        with:
          name: PWdm-v2-APKs
          path: dist/*.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG" dist/*.apk \
            --title "PWdm $TAG" \
            --notes "arm64-v8a APK install karein" \
            --latest
