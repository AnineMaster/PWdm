                      else hls.streamDirectUrl(targetUrl, m.headers, wr) { g, _ -> runOnUiThread { b.statusText.text = "${g / 1024}KB" } }
                      up?.finish(); fos?.close()
                      withContext(Dispatchers.Main) { b.statusText.text = "Done: $name" }
                  } catch (e: Exception) { withContext(Dispatchers.Main) { b.statusText.text = "Err: ${e.message}" } }
              }

              private fun showVault() {
                  val files = vault.listVideos()
                  val labels = files.map { "${it.name} (${it.length() / 1048576}MB)" } + listOf("[Update yt-dlp Engine]")
