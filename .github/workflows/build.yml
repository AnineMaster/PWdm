          class WarpVpnManager(private val ctx: Context, private val client: OkHttpClient) {
              private val backend = GoBackend(ctx.applicationContext)
              private val prefs = ctx.getSharedPreferences("warp_vpn", Context.MODE_PRIVATE)
              var isUp = false; private set

              private val tunnel = object : Tunnel {
                  override fun getName() = "PWdmWarp"
                  override fun onStateChange(newState: Tunnel.State) { isUp = (newState == Tunnel.State.UP) }
              }

              suspend fun toggle(): Boolean = withContext(Dispatchers.IO) {
                  if (isUp) {
                      backend.setState(tunnel, Tunnel.State.DOWN, null)
                      isUp = false
                      false
                  } else {
                      val ini = prefs.getString("wg_ini", null) ?: registerWarp().also {
                          prefs.edit().putString("wg_ini", it).apply()
                      }
                      val cfg = Config.parse(ini.byteInputStream())
                      backend.setState(tunnel, Tunnel.State.UP, cfg)
                      isUp = true
                      true
                  }
              }

              private fun registerWarp(): String {
                  val kp = KeyPair()
                  val priv = kp.privateKey.toBase64()
                  val pub = kp.publicKey.toBase64()
                  val id = UUID.randomUUID().toString().replace("-", "").take(22)
                  val tos = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).apply {
                      timeZone = TimeZone.getTimeZone("UTC")
                  }.format(Date())
                  val payload = JSONObject().put("key", pub).put("install_id", id)
                      .put("fcm_token", "$id:APA91b$id").put("tos", tos).put("model", "Android").put("locale", "en_US").toString()

                  val urls = listOf("https://api.devices.cloudflare.com/v0a2158/reg", "https://api.cloudflareclient.com/v0a2158/reg")
                  var respJson: JSONObject? = null
                  for (u in urls) {
                      if (respJson != null) continue
                      try {
                          val req = Request.Builder().url(u)
                              .header("User-Agent", "okhttp/3.12.1").header("CF-Client-Version", "a-6.10-2158")
                              .post(payload.toRequestBody("application/json".toMediaType())).build()
                          respJson = client.newCall(req).execute().use { r ->
                              if (r.isSuccessful) JSONObject(r.body!!.string()) else null
                          }
                      } catch (_: Exception) {}
                  }
                  val cfg = respJson?.getJSONObject("config")
                  val v4 = cfg?.getJSONObject("interface")?.getJSONObject("addresses")?.optString("v4", "172.16.0.2") ?: "172.16.0.2"
                  val peerPub = cfg?.getJSONArray("peers")?.getJSONObject(0)?.optString("public_key")
                      ?: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
                  return """
                      [Interface]
                      PrivateKey = $priv
                      Address = $v4/32
                      DNS = 1.1.1.1, 1.0.0.1
                      MTU = 1280

                      [Peer]
                      PublicKey = $peerPub
                      AllowedIPs = 0.0.0.0/0
                      Endpoint = 162.159.192.1:2408
                      PersistentKeepalive = 25
                  """.trimIndent()
              }
          }
