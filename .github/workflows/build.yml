name: Build PWdm APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate Project
        run: |
          mkdir -p app/src/main/res/layout app/src/main/java/com/nova/dm/{sniffer,engine,drive,storage}

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
                  maven("https://repo.clojars.org")
              }
          }
          rootProject.name = "PWdm"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.10" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.nova.dm"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nova.dm"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { viewBinding = true }
              lint { checkReleaseBuilds = false; abortOnError = false }
              packaging { resources.excludes += listOf("META-INF/INDEX.LIST", "META-INF/DEPENDENCIES") }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("com.github.teamnewpipe:NewPipeExtractor:v0.26.4")
              implementation("com.google.android.gms:play-services-auth:21.3.0")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepattributes *Annotation*
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          -keep class org.mozilla.javascript.** { *; }
          -keep class org.mozilla.classfile.ClassFileWriter
          -dontwarn org.mozilla.javascript.**
          -dontwarn org.schabi.newpipe.**
          -dontwarn org.jsoup.**
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:label="PWdm"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"
                      android:supportsPictureInPicture="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="8dp">
              <LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content">
