                  val exitFullscreen = b.webView.setupBrowserAndSniffer(
                      b.pageProgress, b.fullscreenContainer, b.browserRoot,
                      onUrlChange = { u -> runOnUiThread { if (!b.urlInput.hasFocus()) b.urlInput.setText(u) } },
                      onMediaFound = { m ->
                          if (caught.putIfAbsent(m.url, m) == null) runOnUiThread { b.btnSniffed.text = "Qualities(${caught.size})" }
                      }
                  )
                  b.webView.loadUrl("https://www.google.com")

                  val loadInput = {
                      val raw = b.urlInput.text.toString().trim()
                      if (raw.isNotEmpty()) {
                          b.urlInput.clearFocus()
                          caught.clear(); b.btnSniffed.text = "Qualities(0)"
                          val target = when {
                              raw.startsWith("http://") || raw.startsWith("https://") -> raw
                              raw.contains(".") && !raw.contains(" ") -> "https://$raw"
                              else -> "https://www.google.com/search?q=${URLEncoder.encode(raw, "UTF-8")}"
                          }
                          b.webView.loadUrl(target)
                          if (target.contains("youtube.com/watch") || target.contains("youtu.be/") || target.contains("/shorts/")) {
                              openQualityTable(target, b.webView.title)
                          }
                      }
                  }
                  b.btnGo.setOnClickListener { loadInput() }
                  b.urlInput.setOnEditorActionListener { _, id, _ -> if (id == EditorInfo.IME_ACTION_GO) { loadInput(); true } else false }
                  b.btnBack.setOnClickListener { if (!exitFullscreen() && b.webView.canGoBack()) b.webView.goBack() }
                  b.btnFwd.setOnClickListener { if (b.webView.canGoForward()) b.webView.goForward() }
                  b.btnReload.setOnClickListener { b.webView.reload() }

                  b.btnThreads.setOnClickListener {
                      threads = when (threads) { 64 -> 32; 32 -> 16; else -> 64 }
                      b.btnThreads.text = "${threads}T"
                  }
                  b.btnDesk.setOnClickListener {
                      desktopMode = !desktopMode
                      b.webView.settings.userAgentString = if (desktopMode) DESKTOP_UA else MOBILE_UA
                      b.btnDesk.text = if (desktopMode) "Desk" else "Mob"
                      b.webView.reload()
                  }
                  b.btnAd.setOnClickListener {
                      AdBlockEngine.enabled = !AdBlockEngine.enabled
                      b.btnAd.text = if (AdBlockEngine.enabled) "Ad:MAX" else "Ad:OFF"
                  }
                  b.btnSniffed.setOnClickListener {
                      openQualityTable(b.webView.url ?: b.urlInput.text.toString().trim(), b.webView.title)
                  }
                  b.btnAuthDrive.setOnClickListener {
                      val req = AuthorizationRequest.builder().setRequestedScopes(listOf(Scope("https://www.googleapis.com/auth/drive.file"))).build()
                      Identity.getAuthorizationClient(this).authorize(req).addOnSuccessListener { res ->
                          if (res.hasResolution()) driveLauncher.launch(IntentSenderRequest.Builder(res.pendingIntent!!.intentSender).build())
                          else { driveToken = res.accessToken; Toast.makeText(this, "Drive Connected", Toast.LENGTH_SHORT).show() }
                      }.addOnFailureListener { Toast.makeText(this, "Auth Err: ${it.message}", Toast.LENGTH_LONG).show() }
                  }
                  b.btnVault.setOnClickListener { showVault() }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (exitFullscreen()) return
                          if (b.webView.canGoBack()) b.webView.goBack() else finish()
                      }
                  })
              }

              private fun openQualityTable(pageUrl: String, pageTitle: String?) = lifecycleScope.launch {
                  b.statusText.text = "Fast-probing qualities..."
                  var ytErr: String? = null
                  val options = withContext(Dispatchers.IO) {
                      if (pageUrl.contains("youtube.com") || pageUrl.contains("youtu.be")) {
                          try { QualityProber.probeYouTube(pageUrl, client) }
                          catch (t: Throwable) { ytErr = t.message; emptyList() }
                      } else {
                          val list = caught.values.toList().sortedByDescending { it.url.contains(".m3u8") || it.url.contains(".mpd") }
                          QualityProber.probeSniffed(pageTitle, pageUrl, list, client)
                      }
                  }
                  if (options.isEmpty()) {
                      val msg = if (ytErr != null) "YT Err: ${ytErr?.take(60)}" else "Play video 2s first, then tap Qualities"
                      b.statusText.text = msg
                      Toast.makeText(this@MainActivity, msg, Toast.LENGTH_SHORT).show()
                      return@launch
                  }
                  b.statusText.text = "${options.size} qualities ready"
                  AlertDialog.Builder(this@MainActivity)
                      .setTitle("${options.first().title.take(35)} (${options.size})")
                      .setItems(options.mapIndexed { idx, o -> "${idx + 1}. ${o.label}" }.toTypedArray()) { _, i ->
                          val opt = options[i]
                          AlertDialog.Builder(this@MainActivity)
                              .setTitle(opt.label)
                              .setPositiveButton("Stream Now") { _, _ -> streamInPlayer(opt) }
                              .setNeutralButton("Save to Vault") { _, _ -> startTurboDownload(opt, false) }
                              .setNegativeButton("Direct GDrive") { _, _ -> startTurboDownload(opt, true) }
                              .show()
                      }.show()
              }

              private fun streamInPlayer(opt: QualityOption) {
                  startActivity(Intent(this, PlayerActivity::class.java).apply {
                      putExtra("path", opt.videoUrl)
                      putExtra("isHls", opt.isHls)
                      putExtra("headers", HashMap(opt.headers))
                  })
              }

              private fun startTurboDownload(opt: QualityOption, toDrive: Boolean) = lifecycleScope.launch(Dispatchers.IO) {
                  val tok = driveToken
                  if (toDrive && tok == null) {
                      withContext(Dispatchers.Main) { Toast.makeText(this@MainActivity, "Tap 'Link Drive' first", Toast.LENGTH_SHORT).show() }
                      return@launch
                  }
                  val safeName = opt.title.replace(Regex("[^a-zA-Z0-9._ -]"), "_").trim().take(42).ifEmpty { "Video" }
                  val name = "${safeName}_${System.currentTimeMillis() % 10000}.mp4"
                  try {
                      if (opt.audioUrl != null) {
                          val tv = File(cacheDir, "v.tmp"); val ta = File(cacheDir, "a.tmp")
                          val out = vault.newFile(name)
                          turbo.downloadDirectToFileTurbo(opt.videoUrl, opt.headers, tv, threads) { g, t ->
                              runOnUiThread { b.statusText.text = "Video (${threads}T): ${g / 1048576}/${if (t > 0) t / 1048576 else "?"}MB" }
                          }
                          turbo.downloadDirectToFileTurbo(opt.audioUrl, opt.headers, ta, threads) { g, _ ->
                              runOnUiThread { b.statusText.text = "Audio (${threads}T): ${g / 1024}KB" }
                          }
                          MuxerEngine.muxVideoAndAudio(tv, ta, out)
                          tv.delete(); ta.delete()
                          if (toDrive) {
                              val up = DriveStreamUploader(client, tok!!, out.name)
                              out.inputStream().use { i -> val bf = ByteArray(256 * 1024); while (true) { val n = i.read(bf); if (n <= 0) break; up.writeChunk(bf.copyOf(n)) } }
                              up.finish(); out.delete()
                          }
                      } else if (opt.isHls) {
                          val up = if (toDrive) DriveStreamUploader(client, tok!!, name) else null
                          val fos = if (!toDrive) vault.newFile(name).outputStream().buffered() else null
                          val wr: suspend (ByteArray) -> Unit = { bytes -> if (up != null) up.writeChunk(bytes) else fos?.write(bytes) }
                          turbo.downloadHlsTurbo(opt.videoUrl, opt.headers, threads, wr) { d, t ->
                              runOnUiThread { b.statusText.text = "HLS (${threads}T): $d/$t" }
                          }
                          up?.finish(); fos?.close()
                      } else if (!toDrive && opt.supportsRange) {
                          val out = vault.newFile(name)
                          turbo.downloadDirectToFileTurbo(opt.videoUrl, opt.headers, out, threads) { g, t ->
                              runOnUiThread { b.statusText.text = "Turbo (${threads}T): ${g / 1048576}/${if (t > 0) t / 1048576 else "?"}MB" }
                          }
                      } else {
                          val up = if (toDrive) DriveStreamUploader(client, tok!!, name) else null
                          val fos = if (!toDrive) vault.newFile(name).outputStream().buffered() else null
                          val wr: suspend (ByteArray) -> Unit = { bytes -> if (up != null) up.writeChunk(bytes) else fos?.write(bytes) }
                          turbo.streamDirect(opt.videoUrl, opt.headers, wr) { g, t ->
                              runOnUiThread { b.statusText.text = "Stream: ${g / 1048576}/${if (t > 0) t / 1048576 else "?"}MB" }
                          }
                          up?.finish(); fos?.close()
                      }
                      withContext(Dispatchers.Main) { b.statusText.text = if (toDrive) "GDrive Done: $name" else "Saved: $name" }
                  } catch (t: Throwable) {
                      withContext(Dispatchers.Main) { b.statusText.text = "Err: ${t.message}" }
                  }
              }

              private fun showVault() {
                  val files = vault.listVideos()
                  if (files.isEmpty()) { Toast.makeText(this, "Vault Empty", Toast.LENGTH_SHORT).show(); return }
                  AlertDialog.Builder(this).setTitle("Vault (${files.size})")
                      .setItems(files.map { "${it.name} (${it.length() / 1048576}MB)" }.toTypedArray()) { _, i ->
                          val f = files[i]
                          AlertDialog.Builder(this).setTitle(f.name)
                              .setPositiveButton("Play (Pattern 2)") { _, _ -> startActivity(Intent(this, PlayerActivity::class.java).putExtra("path", f.absolutePath)) }
                              .setNeutralButton("Copy to Gallery") { _, _ ->
                                  Toast.makeText(this, if (vault.exportToGallery(f)) "Saved to Movies/PWdm" else "Err", Toast.LENGTH_SHORT).show()
                              }
                              .setNegativeButton("Delete") { _, _ -> f.delete() }.show()
                      }.show()
              }
          }
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APKs
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Print Exact Failure
        if: failure()
        run: |
          ERR=$(grep -E "FAILURE:|What went wrong:|Execution failed|^e: " build.log | head -n 5 | tr '\n' ' ')
          echo "::error::$ERR"
          tail -n 60 build.log

      - name: Prepare APK Files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v6
        with:
          name: PWdm-v3-Turbo-APKs
          path: dist/*.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.2.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG" dist/*.apk \
            --title "PWdm Turbo $TAG" \
            --notes "Live Online Streaming (.m3u8/.mp4/YT) + Parallel Fast Prober + Improved Browser & AdBlock" \
            --latest
