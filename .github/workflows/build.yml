                          withContext(Dispatchers.IO) {
                              val up = DriveStreamUploader(client, tok!!, outFile.name)
                              outFile.inputStream().use { ins ->
                                  val bf = ByteArray(256 * 1024)
                                  while (true) { val n = ins.read(bf); if (n <= 0) break; up.writeChunk(bf.copyOf(n)) }
                              }
                              up.finish(); outFile.delete()
                          }
                          b.statusText.text = "Uploaded to GDrive: ${outFile.name}"
                      } else {
                          b.statusText.text = "Saved in Vault: ${outFile.name}"
